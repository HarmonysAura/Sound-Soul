<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE COLLECTIVE™ — UNIFIED OS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   CORE VARIABLES
══════════════════════════════════════════════════ */
:root {
  --bg: #03040a;
  --bg1: #06080f;
  --bg2: #0a0d18;
  --bg3: #0f1422;
  --gold: #f0b429;
  --gold2: #ffd166;
  --cyan: #00e5ff;
  --red: #ff2d55;
  --purple: #bf5af2;
  --green: #30d158;
  --orange: #ff9f0a;
  --text: #f0f4ff;
  --muted: #5a6785;
  --border: rgba(255,255,255,0.06);
  --display: 'Bebas Neue', cursive;
  --body: 'Barlow Condensed', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content:'';
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(240,180,41,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 85% 85%, rgba(0,229,255,0.05) 0%, transparent 60%);
  pointer-events:none;
}
/* grid bg */
body::after {
  content:'';
  position:fixed; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events:none;
}

/* ══ LAYOUT ══ */
.os { display:flex; min-height:100vh; position:relative; z-index:1; }

/* ══ SIDEBAR ══ */
.sidebar {
width: 72px;
background: rgba(6,8,15,0.95);
border-right: 1px solid var(--border);
display:flex; flex-direction:column; align-items:center;
padding: 20px 0;
position:sticky; top:0; height:100vh;
backdrop-filter: blur(20px);
flex-shrink:0; z-index:10;
transition: width 0.3s ease;
}
.sidebar:hover { width: 220px; }

.sidebar-logo {
font-family: var(--display);
font-size: 1.1rem;
letter-spacing: 2px;
color: var(--gold);
margin-bottom: 32px;
white-space: nowrap;
overflow: hidden;
padding: 0 16px;
width:100%;
}

.nav-item {
width:100%;
padding: 12px 16px;
display:flex; align-items:center; gap:12px;
cursor:pointer;
border-left: 2px solid transparent;
transition: all 0.2s;
text-decoration:none; color:var(--muted);
white-space: nowrap; overflow:hidden;
}
.nav-item:hover { background:rgba(240,180,41,0.06); color:var(--text); }
.nav-item.active {
border-left-color: var(--gold);
background:rgba(240,180,41,0.08);
color: var(--gold);
}

.nav-icon { font-size:1.2rem; flex-shrink:0; width:24px; text-align:center; }
.nav-label {
font-family: var(--mono);
font-size: 0.7rem;
letter-spacing: 1.5px;
text-transform: uppercase;
}

.sidebar-divider {
width:80%; height:1px;
background: var(--border);
margin: 8px 0;
}

/* ══ MAIN ══ */
.main { flex:1; overflow:hidden; }

/* ══ PANELS ══ */
.panel { display:none; height:100vh; overflow-y:auto; padding:32px 36px 60px; }
.panel.active { display:block; }

/* ══ PANEL HEADER ══ */
.panel-head {
margin-bottom: 28px;
padding-bottom: 20px;
border-bottom: 1px solid rgba(240,180,41,0.15);
}
.panel-kicker {
font-family: var(--mono);
font-size: 0.6rem;
letter-spacing: 3px;
color: var(--gold);
text-transform: uppercase;
margin-bottom: 8px;
}
.panel-title {
font-family: var(--display);
font-size: clamp(2.5rem, 5vw, 5rem);
letter-spacing: 2px;
line-height: 0.9;
color:#fff;
}
.panel-title span { color:var(--gold); }
.panel-sub {
font-family: var(--mono);
font-size: 0.72rem;
color: var(--muted);
margin-top: 10px;
line-height: 1.6;
}

/* ══ STAT GRID ══ */
.stat-grid {
display:grid;
grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
gap:12px; margin-bottom:28px;
}
.stat-card {
background: var(--bg2);
border:1px solid var(--border);
border-radius:10px; padding:16px;
text-align:center;
position:relative; overflow:hidden;
}
.stat-card::before {
content:'';
position:absolute; top:0; left:0; right:0; height:2px;
background: var(--accent, var(--gold));
}
.stat-n {
font-family: var(--display);
font-size:2.2rem;
background: linear-gradient(135deg, var(--gold), var(--cyan));
-webkit-background-clip:text; background-clip:text; color:transparent;
}
.stat-l {
font-family: var(--mono);
font-size:0.58rem;
letter-spacing:2px;
text-transform:uppercase;
color:var(--muted);
margin-top:4px;
}

/* ══ SECTION TITLES ══ */
.sec-head {
display:flex; align-items:center; gap:12px;
margin: 24px 0 14px;
}
.sec-title {
font-family: var(--display);
font-size:1.6rem;
letter-spacing:2px;
color:#fff;
}
.sec-line {
flex:1; height:1px;
background: linear-gradient(90deg, rgba(240,180,41,0.2), transparent);
}

/* ══ CARDS ══ */
.card-grid {
display:grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap:14px; margin-bottom:24px;
}
.card {
background: var(--bg2);
border:1px solid var(--border);
border-radius:10px; padding:18px;
transition: transform 0.2s, border-color 0.2s;
cursor:pointer; position:relative; overflow:hidden;
}
.card::before {
content:'';
position:absolute; top:0; left:0; right:0; height:2px;
background: var(--c-accent, var(--gold));
}
.card:hover {
transform:translateY(-2px);
border-color: rgba(240,180,41,0.3);
}
.card-tag {
font-family:var(--mono);
font-size:0.58rem; letter-spacing:2.5px;
color:var(--c-accent, var(--gold));
text-transform:uppercase; margin-bottom:8px;
}
.card-title {
font-family:var(--display);
font-size:1.3rem; letter-spacing:1.5px;
color:#fff; margin-bottom:8px; line-height:1.1;
}
.card-body {
font-family:var(--mono);
font-size:0.72rem; line-height:1.65;
color:#9aabb8;
}
.card-foot {
margin-top:12px; padding-top:10px;
border-top:1px solid var(--border);
display:flex; gap:8px; flex-wrap:wrap;
}
.badge {
font-family:var(--mono);
font-size:0.58rem; padding:3px 8px;
border-radius:3px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
color:var(--muted);
letter-spacing:1px; text-transform:uppercase;
}

/* ... remaining styles and markup omitted for brevity in this commit ... */
</style>

</head>
<body>
<div class="os">
<nav class="sidebar">
  <div class="sidebar-logo">TC™ OS</div>
  <div class="nav-item active" onclick="show('home')"><span class="nav-icon">⚡</span><span class="nav-label">Command</span></div>
  <div class="nav-item" onclick="show('moments')"><span class="nav-icon">🏛</span><span class="nav-label">Archive</span></div>
  <div class="nav-item" onclick="show('campus')"><span class="nav-icon">🌐</span><span class="nav-label">Campus</span></div>
  <div class="nav-item" onclick="show('npc')"><span class="nav-icon">🎭</span><span class="nav-label">Factions</span></div>
  <div class="nav-item" onclick="show('eberswalde')"><span class="nav-icon">🛸</span><span class="nav-label">Eberswalde</span></div>
</nav>
<div class="main">
  <div class="panel active" id="panel-home">
    <div class="panel-head">
      <div class="panel-kicker">THE COLLECTIVE™ · UNIFIED OS</div>
      <div class="panel-title">COMMAND<br><span>CENTER</span></div>
      <div class="panel-sub">DaKiddFr3sh / The Paradox Architect · ecollective.co · theauracollective666@gmail.com</div>
    </div>
  </div>
</div>
</div>
<script>
function show(panelId) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const panel = document.getElementById('panel-'+panelId);
  if (panel) panel.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    if (n.getAttribute('onclick') === `show('${panelId}')`) n.classList.add('active');
  });
}
</script>
</body>
</html>
